<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>VozzAI — Assinatura confirmada</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg:#F1F0EC; --ink:#111319; --muted:#5B606B; --line:#DBD9D2; --accent:#1B34C4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0B0C10; --ink:#EFEFEC; --muted:#9CA2AE; --line:#262A33; --accent:#7089FF; }
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink); text-align: center; padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { max-width: 440px; }
  .check { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 22px; font-size: 28px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0 0 22px; }
  a.btn { display: inline-flex; padding: 13px 22px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 650; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Assinatura confirmada</h1>
    <p>Seu pagamento foi recebido e o plano Pro já está ativo na sua conta. Pode voltar pro VozzAI — o app reconhece a assinatura automaticamente na próxima vez que abrir.</p>
    <a class="btn" href="https://wa.me/5551980902571?text=Oi!%20Acabei%20de%20assinar%20o%20Pro%20e%20tenho%20uma%20d%C3%BAvida.">Dúvida? Chama no WhatsApp</a>
  </div>
</body>
</html>
