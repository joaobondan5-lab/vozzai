<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px; margin: 0; padding: 18px; background: #fff; color: #111319;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 15.5px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    input {
      width: 100%; box-sizing: border-box; padding: 9px 11px; margin-bottom: 8px;
      border: 1px solid #DBD9D2; border-radius: 8px; font: inherit; font-size: 13.5px;
    }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #1B34C4; color: #fff; font: inherit; font-weight: 650; font-size: 13.5px;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: #5B606B; margin-top: 8px; }
    .msg { font-size: 12px; color: #D93A1D; margin-top: 8px; min-height: 14px; }
    .mode-label { display: block; font-size: 11px; color: #5B606B; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin: 12px 0 5px; }
    select {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #DBD9D2; border-radius: 8px; font: inherit; font-size: 13px; background: #fff;
    }
    .status { font-size: 13.5px; }
    .usage { font-size: 12px; color: #5B606B; margin-top: 6px; }
    #subscribeBtn { margin-top: 12px; }
    .subMsg { font-size: 12px; color: #D93A1D; margin-top: 8px; min-height: 14px; }
    .hint { font-size: 11px; color: #8B909B; margin-top: 14px; border-top: 1px solid #eee; padding-top: 10px; }
    .toggle { text-align: center; font-size: 12px; color: #1B34C4; cursor: pointer; margin-top: 4px; }
    /* Ditado que não coube na aba (chrome://, PDF, Web Store): fica aqui
       pra pessoa copiar, em vez de sumir depois de já ter sido cobrado. */
    #pending { display: none; border: 1px solid #DBD9D2; border-radius: 8px;
               padding: 10px; margin-bottom: 12px; background: #FBFAF7; }
    #pending h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                  color: #5B606B; margin: 0 0 6px; }
    #pendingText { font-size: 12.5px; line-height: 1.45; max-height: 88px;
                   overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>🎙️ VozzAI</h1>

  <div id="pending">
    <h2>Ditado guardado</h2>
    <div id="pendingText"></div>
    <button id="copyPendingBtn" style="width:100%; margin-top:8px;">Copiar texto</button>
    <button class="ghost" id="dismissPendingBtn" style="width:100%">Descartar</button>
  </div>

  <div id="loggedOut">
    <input id="email" type="email" placeholder="seu@email.com.br" autocomplete="username" />
    <input id="password" type="password" placeholder="senha" autocomplete="current-password" />
    <button id="submitBtn">Entrar</button>
    <p class="toggle" id="toggleMode">Ainda não tem conta? Criar conta</p>
    <p class="msg" id="msg"></p>
  </div>

  <div id="loggedIn" style="display:none">
    <p class="status" id="status"></p>
    <p class="usage" id="usage"></p>
    <label class="mode-label" for="modeSelect">Modo de escrita</label>
    <select id="modeSelect">
      <option value="padrao">Padrão</option>
      <option value="whatsapp">WhatsApp</option>
      <option value="email">E-mail profissional</option>
      <option value="objetivo">Objetivo</option>
      <option value="fiel">Transcrição fiel</option>
      <option value="atendimento">Atendimento · Pro</option>
      <option value="vendas">Vendas · Pro</option>
      <option value="juridico">Jurídico · Pro</option>
      <option value="dev">Desenvolvedor · Pro</option>
      <option value="orcamento">Orçamento · Pro</option>
      <option value="conteudo">Conteúdo · Pro</option>
    </select>
    <div id="subscribeBox" style="display:none">
      <button id="subscribeAnnualBtn" style="width:100%">Assinar Pro anual — R$ 249/ano · 30% off</button>
      <button id="subscribeMonthlyBtn" class="ghost" style="width:100%; margin-top:6px;">Prefiro mensal — R$ 29,90/mês</button>
    </div>
    <p class="subMsg" id="subMsg"></p>
    <button class="ghost" id="logoutBtn">Sair</button>
  </div>

  <p class="hint">Atalho: Ctrl+Shift+Espaço (⌘+Shift+Espaço no Mac)</p>
  <script src="popup.js"></script>
</body>
</html>
