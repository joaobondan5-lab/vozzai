<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>VozzAI — Histórico</title>
  <style>
    :root {
      --bg: #0B1A17; --surface: #10221E; --line: #1F332D; --ink: #ECEFEA;
      --muted: #97A79F; --brand: #38C79A; --accent: #F5B646; --danger: #FB7C5F;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F5F2EC; --surface: #FDFBF6; --line: #E2DBCD; --ink: #17211E;
        --muted: #57655F; --brand: #0E6E5C; --accent: #E0951C; --danger: #E15B3D;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); padding: 22px; line-height: 1.5; font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
    p.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 16px; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    button {
      font: inherit; font-size: 12.5px; font-weight: 650; padding: 7px 13px; border-radius: 999px;
      border: 1.5px solid var(--line); cursor: pointer; background: transparent; color: var(--ink);
    }
    button:hover { border-color: var(--brand); color: var(--brand); }
    button.danger:hover { border-color: var(--danger); color: var(--danger); }
    label.switch { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 12.5px; cursor: pointer; margin-left: auto; }
    .entry {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 13px 15px; margin-bottom: 10px;
    }
    .entry .meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
    .entry .meta .warn { color: var(--accent); }
    .entry .text { white-space: pre-wrap; word-break: break-word; max-height: 88px; overflow: hidden; }
    .entry .acts { display: flex; gap: 8px; margin-top: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 12px; }
    .off-note { color: var(--accent); font-size: 12.5px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Histórico de transcrições</h1>
  </header>
  <p class="hint">Guardado só neste Mac (últimas 50), nunca no servidor. O áudio não é salvo — só o texto final.</p>

  <div class="toolbar">
    <button class="danger" id="clearAll">Limpar tudo</button>
    <label class="switch"><input type="checkbox" id="toggleHistory" /> Guardar novas transcrições</label>
  </div>
  <p class="off-note" id="offNote">Histórico pausado — os próximos ditados não serão guardados.</p>

  <div id="list"></div>

  <script>
    const api = window.vozzaHistory;
    const listEl = document.getElementById('list');
    const toggleEl = document.getElementById('toggleHistory');
    const offNote = document.getElementById('offNote');

    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) +
        ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    async function render() {
      const { enabled, entries } = await api.list();
      toggleEl.checked = enabled;
      offNote.style.display = enabled ? 'none' : 'block';

      if (!entries.length) {
        listEl.innerHTML = '<p class="empty">Nenhuma transcrição ainda.<br>Tudo que você ditar aparece aqui para copiar ou inserir de novo.</p>';
        return;
      }

      listEl.textContent = '';
      for (const e of entries) {
        const card = document.createElement('div');
        card.className = 'entry';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML =
          `<span>${fmtDate(e.createdAt)}</span><span>${e.words} palavra${e.words === 1 ? '' : 's'}</span>` +
          (e.inserted ? '' : '<span class="warn">ficou na área de transferência</span>');

        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = e.text;

        const acts = document.createElement('div');
        acts.className = 'acts';
        const mkBtn = (label, fn, danger) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (danger) b.className = 'danger';
          b.addEventListener('click', fn);
          return b;
        };
        acts.append(
          mkBtn('Copiar', async () => { await api.copy(e.id); }),
          mkBtn('Inserir no cursor', async () => { await api.insert(e.id); }),
          mkBtn('Excluir', async () => { await api.remove(e.id); render(); }, true),
        );

        card.append(meta, text, acts);
        listEl.appendChild(card);
      }
    }

    document.getElementById('clearAll').addEventListener('click', async () => {
      await api.clear();
      render();
    });

    toggleEl.addEventListener('change', async () => {
      await api.toggle(toggleEl.checked);
      render();
    });

    api.onChanged(render);
    render();
  </script>
</body>
</html>
