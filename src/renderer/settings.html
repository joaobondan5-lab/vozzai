<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Vozza — Configurações</title>
  <style>
    :root {
      --bg: #0B1A17; --surface: #10221E; --line: #1F332D; --ink: #ECEFEA;
      --muted: #97A79F; --brand: #38C79A; --accent: #F5B646; --danger: #FB7C5F;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F5F2EC; --surface: #FDFBF6; --line: #E2DBCD; --ink: #17211E;
        --muted: #57655F; --brand: #0E6E5C; --accent: #E0951C; --danger: #E15B3D;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); padding: 26px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 18px; letter-spacing: -0.02em; }
    .brand svg rect:nth-child(1) { fill: var(--brand); }
    .brand svg rect:nth-child(2) { fill: var(--accent); }
    .brand svg rect:nth-child(3) { fill: var(--brand); }
    .brand svg rect:nth-child(4) { fill: var(--danger); }
    h1 { font-size: 15px; margin: 24px 0 6px; }
    p.hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 11px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 20px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex: none; }
    .dot.ok { background: var(--brand); }
    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 7px; }
    input {
      width: 100%; font: inherit; font-size: 14px; padding: 11px 13px; border-radius: 10px;
      border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); margin-bottom: 12px;
    }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    .row { display: flex; gap: 10px; margin-top: 4px; }
    button {
      font: inherit; font-weight: 650; font-size: 14px; padding: 11px 18px; border-radius: 999px;
      border: none; cursor: pointer; background: var(--brand); color: var(--bg); transition: filter .15s ease;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    .toggle { margin-top: 12px; font-size: 12.5px; color: var(--brand); cursor: pointer; text-align: center; }
    .ok-msg { margin-top: 14px; font-size: 13px; color: var(--danger); min-height: 18px; }
    .usage { font-size: 12.5px; color: var(--muted); margin-top: -6px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="9" width="3.4" height="8" rx="1.7"></rect>
      <rect x="7" y="4" width="3.4" height="18" rx="1.7"></rect>
      <rect x="13" y="10" width="3.4" height="6" rx="1.7"></rect>
      <rect x="19" y="6" width="3.4" height="14" rx="1.7"></rect>
    </svg>
    Vozza
  </div>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Verificando…</span>
  </div>

  <div id="loggedOut">
    <h1 id="formTitle">Entrar</h1>
    <p class="hint">Sua conta Vozza — a transcrição roda no nosso servidor, você não precisa de chave nenhuma.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com.br" autocomplete="username" />
    <label for="password">Senha</label>
    <input id="password" type="password" placeholder="senha" autocomplete="current-password" />
    <div class="row">
      <button id="submit">Entrar</button>
    </div>
    <p class="toggle" id="toggleMode">Ainda não tem conta? Criar conta</p>
    <div class="ok-msg" id="msg" role="status" aria-live="polite"></div>
  </div>

  <div id="loggedIn" style="display:none">
    <h1>Sua conta</h1>
    <p class="usage" id="usage"></p>
    <div class="row">
      <button id="subscribe" style="display:none">Assinar Pro — R$ 29,90/mês</button>
    </div>
    <div class="ok-msg" id="subMsg" role="status" aria-live="polite"></div>
    <button class="secondary" id="logout">Sair</button>
  </div>

  <script>
    const api = window.vozzaSettings;
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const loggedOutEl = document.getElementById('loggedOut');
    const loggedInEl = document.getElementById('loggedIn');
    const msgEl = document.getElementById('msg');
    const submitBtn = document.getElementById('submit');
    const formTitle = document.getElementById('formTitle');
    const toggleModeEl = document.getElementById('toggleMode');
    const subscribeBtn = document.getElementById('subscribe');
    const subMsgEl = document.getElementById('subMsg');

    let mode = 'login';

    function renderLoggedOut() {
      dot.classList.remove('ok');
      statusText.textContent = 'Sem conta conectada';
      loggedOutEl.style.display = 'block';
      loggedInEl.style.display = 'none';
    }

    function renderLoggedIn(email, plan) {
      dot.classList.add('ok');
      statusText.textContent = `Conectado como ${email}`;
      loggedOutEl.style.display = 'none';
      loggedInEl.style.display = 'block';
      subscribeBtn.style.display = plan === 'pro' ? 'none' : 'block';
    }

    api.getConfig().then((cfg) => {
      if (cfg.loggedIn) renderLoggedIn(cfg.email, cfg.plan);
      else renderLoggedOut();
    });

    subscribeBtn.addEventListener('click', async () => {
      subscribeBtn.disabled = true;
      subMsgEl.style.color = 'var(--muted)';
      subMsgEl.textContent = 'Abrindo checkout no navegador…';
      const result = await api.subscribe();
      subscribeBtn.disabled = false;
      if (!result.ok) {
        subMsgEl.style.color = 'var(--danger)';
        subMsgEl.textContent = result.error || 'Não consegui iniciar a assinatura.';
        return;
      }
      subMsgEl.textContent = 'Continue no navegador que abriu para concluir o pagamento.';
    });

    toggleModeEl.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      formTitle.textContent = mode === 'login' ? 'Entrar' : 'Criar conta';
      submitBtn.textContent = mode === 'login' ? 'Entrar' : 'Criar conta';
      toggleModeEl.textContent = mode === 'login' ? 'Ainda não tem conta? Criar conta' : 'Já tem conta? Entrar';
      msgEl.textContent = '';
    });

    submitBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      msgEl.style.color = 'var(--muted)';
      msgEl.textContent = mode === 'login' ? 'Entrando…' : 'Criando conta…';

      const result = mode === 'login' ? await api.login(email, password) : await api.signup(email, password);

      if (!result.ok) {
        msgEl.style.color = 'var(--danger)';
        msgEl.textContent = result.error || 'Algo deu errado.';
        return;
      }
      msgEl.textContent = '';
      const cfg = await api.getConfig();
      renderLoggedIn(cfg.email, cfg.plan);
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await api.logout();
      renderLoggedOut();
    });
  </script>
</body>
</html>
